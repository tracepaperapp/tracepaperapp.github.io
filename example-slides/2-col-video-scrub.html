<section
  x-data="scrollVideo()"
  x-init="init()"
  @scroll.window.passive="update()"
  class="relative h-[500vh]"
>
  <!-- Sticky container -->
  <div class="sticky top-0 h-screen flex items-center justify-center">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-8">
        <video
          x-ref="video"
          src="/assets/the-problem.mp4"
          class="w-full transition-opacity duration-300"
          muted
          playsinline
          preload="auto"
          :class="visible ? 'opacity-100' : 'opacity-0'"></video>
      </div>
      <div class="col-span-4">
        <p x-text="progress"></p>
        <div class="bg-white/15 backdrop-blur rounded-xl p-6 m-3" x-show="progress > 0.1 && progress < 0.9" x-cloak x-transition>
          <p class="text-base"
             x-show="progress > 0.1 && progress < 0.2"
             x-cloak
             x-transition>
            1
          </p>

          <p class="text-base"
             x-show="progress > 0.2 && progress < 0.3"
             x-cloak
             x-transition>
            2
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
